<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="800" height="550" role="img" aria-label="TL Gaming — Đang cập nhật ảnh chụp thực tế sản phẩm">
    <defs>
        <linearGradient id="stitchBg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#F8FAFC"/>
            <stop offset="100%" stop-color="#EEF2FF"/>
        </linearGradient>
    </defs>

    <!-- Nền sáng chuẩn Google Stitch Light Retail -->
    <rect width="800" height="550" rx="16" fill="url(#stitchBg)"/>
    <rect x="24" y="24" width="752" height="502" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="10 8"/>

    <!-- Nhãn thương hiệu góc trên -->
    <rect x="52" y="48" width="144" height="32" rx="8" fill="#DBEAFE"/>
    <text x="124" y="69" fill="#1D4ED8" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800" text-anchor="middle">TL GAMING</text>

    <!-- Biểu tượng Máy tính & Ống kính máy ảnh ở trung tâm -->
    <g transform="translate(400, 230)" fill="none" stroke="#2563EB" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="0" cy="0" r="68" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="2"/>
        <!-- Màn hình / Case PC -->
        <rect x="-36" y="-26" width="52" height="38" rx="6" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="3"/>
        <line x1="-20" y1="22" x2="0" y2="22" stroke="#1D4ED8" stroke-width="3"/>
        <line x1="-10" y1="12" x2="-10" y2="22" stroke="#1D4ED8" stroke-width="3"/>
        <!-- Tháp CPU bên phải -->
        <rect x="22" y="-30" width="22" height="52" rx="4" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="3"/>
        <circle cx="33" cy="-16" r="2.5" fill="#1D4ED8" stroke="none"/>
        <line x1="27" y1="8" x2="39" y2="8" stroke="#1D4ED8" stroke-width="2.5"/>
    </g>

    <!-- Dòng tiêu đề & chú thích rõ ràng -->
    <text x="400" y="346" fill="#111C2D" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800" text-anchor="middle">ẢNH SẢN PHẨM ĐANG CẬP NHẬT</text>
    <text x="400" y="380" fill="#475569" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="middle">Đang chờ bổ sung ảnh chụp thực tế đúng mẫu &amp; cấu hình tại cửa hàng</text>
    <text x="400" y="410" fill="#64748B" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" text-anchor="middle">Quý khách vui lòng xem thông số chi tiết và biên bản kiểm định bên dưới</text>
</svg>
